# Private depth_mapping parameters. ROS warehouse X/Y horizontal, Z up; metres/seconds.
resolution: 0.25
radius: 8.0
vertical_radius: 3.0
maximum_age: 2.0
surface_margin: 0.1
pixel_stride: 8
maximum_observation_age: 0.5
update_rate: 4.0
camera_heading: [0.0, 1.0]
# Planner outputs HOLD until the full vehicle envelope is measured and configured.
# Format: [ROS X half-extent, ROS Y half-extent, below root, above root] (metres)
# planner_envelope: [<measured>, <measured>, <measured>, <measured>]
planner_max_expansions: 4000
planner_envelope: [1.55, 1.40, 1.26, 0.772]